<router-outlet></router-outlet>

<footer>
  <div class="links">
    <ul class="nav nav-pills">
      @for (link of links; track link) {
        <li class="nav-item">
          <a class="nav-link" href="{{link.link}}">{{link.name}}</a>
        </li>
      }
    </ul>
  </div>
  <button
    type="button"
    class="theme-toggle"
    (click)="toggleTheme()"
    [attr.aria-label]="currentTheme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
    title="Toggle dark mode">
    <i class="fas" [class.fa-moon]="currentTheme === 'light'" [class.fa-sun]="currentTheme === 'dark'" aria-hidden="true"></i>
  </button>
</footer>
