<meta name="keywords" content="jose mauricio paez developer projects code samples examples">
<meta name="description" content="These are the various projects of Mauricio Paez - Developer">
<meta name="author" content="Mauricio Paez - Developer">
<div class="projects">

  @for (project of currentCards; track project) {
    <div
      class="project {{ project.card.card_class }}"
      [style.backgroundImage]="project.card.background_image ? 'url(' + project.card.background_image + ')' : null"
      routerLink="/Projects/{{ project.project_name }}">
      <h3>{{ project.card.title }}</h3>
      @if (project.card.subtitle) {
        <h6>{{ project.card.subtitle }}</h6>
      }
      @if (project.card.image) {
        <img src="{{ project.card.image }}" alt="{{ project.card.title }}">
      }
      @if (project.card.icons) {
        <div class="{{ project.card.icons.class_name }}">
          @for (icon of project.card.icons.icons; track icon) {
            <i class="{{ icon }}" aria-hidden="true"></i>
          }
        </div>
      }
    </div>
  }

</div>
