@if (currentContent.navbar) {
  <nav>
    <h1>{{ '{'}} {{ currentContent.navbar.title }} {{ '}'}}</h1>
    <div class="links">
      <ul class="nav nav-pills">
        @for (link of currentContent.navbar.links; track link) {
          <li class="nav-item array-coma-3">
            <a class="nav-link" routerLink="/{{ link }}">{{ link }}</a>
          </li>
        }
      </ul>
    </div>
  </nav>
}
